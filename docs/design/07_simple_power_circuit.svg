<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='760' viewBox='0 0 1180 760' xmlns:c2pa="http://c2pa.org/manifest"><rect width='100%' height='100%' fill='white'/><text x='24' y='34' font-family='Helvetica, Arial, sans-serif' font-size='22' fill='#1d2430' text-anchor='start' font-weight='bold'>Magic Wand pen: simple battery-to-Nano circuit</text><text x='24' y='56' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#5a6473' text-anchor='start' font-weight='normal'>Power only. No force sensor, no charger port: the battery unplugs and charges on a 1S LiPo charger.</text><rect x='40' y='140' width='170' height='130' rx='8' fill='#7aa6d8' stroke='#1d2430' stroke-width='1.2'/><text x='125.0' y='162' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='white' text-anchor='middle' font-weight='bold'>LiPo 1S 3.7 V</text><text x='125.0' y='178' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#e8eef5' text-anchor='middle' font-weight='normal'>Spektrum 800 mAh, 51x24x8</text><text x='202' y='206' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='end' font-weight='normal'>+ (red)</text><text x='202' y='236' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='end' font-weight='normal'>− (black)</text><text x='125' y='300' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5a6473' text-anchor='middle' font-weight='normal'>JST-RCY plug</text><path d='M210,202 L250,202' fill='none' stroke='#d62828' stroke-width='3' stroke-linejoin='round'/><path d='M210,232 L250,232' fill='none' stroke='#222' stroke-width='3' stroke-linejoin='round'/><rect x='250' y='186' width='22' height='54' rx='3' fill='#e33' stroke='#1d2430'/><text x='261' y='178' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1d2430' text-anchor='middle' font-weight='bold'>J1</text><text x='261' y='262' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#5a6473' text-anchor='middle' font-weight='normal'>RCY</text><rect x='330' y='140' width='170' height='130' rx='8' fill='#6b4fa3' stroke='#1d2430' stroke-width='1.2'/><text x='415.0' y='162' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='white' text-anchor='middle' font-weight='bold'>1S protection board</text><text x='415.0' y='178' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#e8eef5' text-anchor='middle' font-weight='normal'>DW01A + FS8205 (≈ 3 x 20 mm)</text><text x='338' y='206' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'>B+</text><text x='338' y='236' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'>B−</text><text x='492' y='206' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='end' font-weight='normal'>P+</text><text x='492' y='236' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='end' font-weight='normal'>P−</text><path d='M272,202 L330,202' fill='none' stroke='#d62828' stroke-width='3' stroke-linejoin='round'/><path d='M272,232 L330,232' fill='none' stroke='#222' stroke-width='3' stroke-linejoin='round'/><text x='415' y='300' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5a6473' text-anchor='middle' font-weight='normal'>cuts off below ≈ 2.4–3.0 V</text><text x='415' y='316' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5a6473' text-anchor='middle' font-weight='normal'>and on a short circuit</text><path d='M500,202 L560,202' fill='none' stroke='#d62828' stroke-width='3' stroke-linejoin='round'/><circle cx='563' cy='202' r='4' fill='white' stroke='#1d2430' stroke-width='1.5'/><circle cx='603' cy='202' r='4' fill='white' stroke='#1d2430' stroke-width='1.5'/><path d='M566,202 L600,186' fill='none' stroke='#1d2430' stroke-width='2' stroke-linejoin='round'/><text x='583' y='176' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1d2430' text-anchor='middle' font-weight='bold'>SW1 slide switch</text><path d='M607,202 L640,202' fill='none' stroke='#d62828' stroke-width='3' stroke-linejoin='round'/><rect x='640' y='140' width='170' height='130' rx='8' fill='#3b8d3e' stroke='#1d2430' stroke-width='1.2'/><text x='725.0' y='162' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='white' text-anchor='middle' font-weight='bold'>5 V boost</text><text x='725.0' y='178' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#e8eef5' text-anchor='middle' font-weight='normal'>Pololu U1V11F5 (or similar)</text><text x='648' y='206' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'>VIN</text><text x='648' y='236' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'>GND</text><text x='802' y='206' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='end' font-weight='normal'>VOUT</text><text x='802' y='236' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='end' font-weight='normal'>GND </text><path d='M607,202 L640,202' fill='none' stroke='#d62828' stroke-width='3' stroke-linejoin='round'/><path d='M500,232 L640,232' fill='none' stroke='#222' stroke-width='3' stroke-linejoin='round'/><rect x='900' y='120' width='240' height='260' rx='8' fill='#0f7b8a' stroke='#1d2430' stroke-width='1.2'/><text x='1020.0' y='142' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='white' text-anchor='middle' font-weight='bold'>Arduino Nano 33 BLE</text><text x='1020.0' y='158' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#e8eef5' text-anchor='middle' font-weight='normal'>Sense Rev2</text><text x='908' y='186' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'>VIN</text><text x='908' y='216' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'>GND</text><text x='908' y='246' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'>A1 (optional)</text><text x='908' y='276' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'></text><text x='908' y='306' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='white' text-anchor='start' font-weight='normal'>D2</text><path d='M810,202 L860,202 L860,182 L900,182' fill='none' stroke='#d62828' stroke-width='3' stroke-linejoin='round'/><path d='M810,232 L880,232 L880,212 L900,212' fill='none' stroke='#222' stroke-width='3' stroke-linejoin='round'/><text x='850' y='174' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#d62828' text-anchor='end' font-weight='bold'>5 V</text><path d='M600,202 L600,360' fill='none' stroke='#d62828' stroke-width='2' stroke-linejoin='round' stroke-dasharray='6,4'/><circle cx='600' cy='202' r='4' fill='#1d2430'/><rect x='593' y='360' width='14' height='36' fill='#c9b38a' stroke='#1d2430' stroke-dasharray='4,3'/><text x='614' y='382' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1d2430' text-anchor='start' font-weight='normal'>R1 100 kΩ</text><path d='M600,396 L600,430' fill='none' stroke='#e0c000' stroke-width='2' stroke-linejoin='round' stroke-dasharray='6,4'/><circle cx='600' cy='430' r='4' fill='#1d2430'/><rect x='593' y='450' width='14' height='36' fill='#c9b38a' stroke='#1d2430' stroke-dasharray='4,3'/><text x='614' y='472' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1d2430' text-anchor='start' font-weight='normal'>R2 100 kΩ</text><path d='M600,430 L600,450' fill='none' stroke='#e0c000' stroke-width='2' stroke-linejoin='round' stroke-dasharray='6,4'/><path d='M600,486 L600,520 L575,520 L575,232' fill='none' stroke='#222' stroke-width='2' stroke-linejoin='round' stroke-dasharray='6,4'/><circle cx='575' cy='232' r='4' fill='#1d2430'/><path d='M600,430 L870,430 L870,242 L900,242' fill='none' stroke='#e0c000' stroke-width='2' stroke-linejoin='round' stroke-dasharray='6,4'/><text x='640' y='450' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5a6473' text-anchor='start' font-weight='normal'>optional: battery level on A1 (reads half the cell voltage)</text><path d='M900,302 L850,302 L850,476' fill='none' stroke='#1f6fd1' stroke-width='2' stroke-linejoin='round'/><circle cx='850' cy='480' r='4' fill='white' stroke='#1d2430' stroke-width='1.5'/><circle cx='850' cy='520' r='4' fill='white' stroke='#1d2430' stroke-width='1.5'/><path d='M850,484 L836,514' fill='none' stroke='#1d2430' stroke-width='2' stroke-linejoin='round'/><path d='M850,524 L850,540 L890,540 L890,212' fill='none' stroke='#222' stroke-width='2' stroke-linejoin='round'/><text x='830' y='505' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1d2430' text-anchor='end' font-weight='bold'>SW2 pen-down button (optional)</text><text x='40' y='570' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1d2430' text-anchor='start' font-weight='bold'>How it works</text><text x='40' y='590' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1d2430' text-anchor='start' font-weight='normal'>Battery (3.7–4.2 V) → protection board → power switch → boost to 5 V → Nano VIN. The Nano's own regulator makes the 3.3 V.</text><text x='40' y='608' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1d2430' text-anchor='start' font-weight='bold'>Wire it</text><text x='40' y='628' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1d2430' text-anchor='start' font-weight='normal'>1. Solder a JST-RCY female pigtail to the protection board's B+ / B− so the battery stays removable.</text><text x='40' y='646' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1d2430' text-anchor='start' font-weight='normal'>2. P+ goes through SW1 to the boost VIN; P− goes straight to the boost GND. Boost VOUT → Nano VIN, boost GND → Nano GND.</text><text x='40' y='664' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1d2430' text-anchor='start' font-weight='normal'>3. Use 26 AWG for the power wires. Check your board revision's VIN range on the Arduino page before powering up.</text><text x='40' y='682' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1d2430' text-anchor='start' font-weight='bold'>Safety</text><text x='40' y='702' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1d2430' text-anchor='start' font-weight='normal'>• The Spektrum pack has no protection circuit; the small 1S board stops it being drained flat. Without it, switch off as soon as the pen dies.</text><text x='40' y='720' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1d2430' text-anchor='start' font-weight='normal'>• Never connect the battery to the Nano's 3V3 pin, and switch SW1 off when the USB cable is plugged in.</text><text x='40' y='738' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1d2430' text-anchor='start' font-weight='normal'>• Charge only out of the pen, on a 1S LiPo charger set to ≤ 0.8 A.</text><text x='1156' y='746' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#5a6473' text-anchor='end' font-weight='normal'>Magic Wand pen, simple power circuit, 2026-11-10</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>